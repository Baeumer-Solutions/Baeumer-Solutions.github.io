function welcome(){return `<div class="brand-hero"><div class="eyebrow">Ihr persönlicher Fragebogen</div><h1>Erzählen Sie uns von Ihrem Alltag<br>und Ihren vorhandenen Vorräten.</h1><p class="lead">Damit wir Ihre Vorsorge planen können, brauchen wir einige Angaben von Ihnen. Gehen Sie die Abschnitte nacheinander durch und antworten Sie direkt bei der jeweiligen Frage.</p><button class="primary start-button" id="start">Jetzt mit dem Haushalt beginnen →</button><span class="art-credit">KI-Motiv aus dem Protect-12-Markenbestand</span></div><div class="start-steps"><div><span class="step-number">1</span><h3>Direkt antworten</h3><p>Klicken Sie passende Antworten an. Namen und Mengen tragen Sie kurz ein. Bereits bekannte Angaben sind ausgefüllt.</p></div><div><span class="step-number">2</span><h3>Unbekanntes offenlassen</h3><p>Nutzen Sie „Weiß ich nicht“ oder „Persönlich besprechen“. Sie müssen nichts recherchieren oder ausrechnen.</p></div><div><span class="step-number">3</span><h3>Vorhandenes zeigen</h3><p>Bei der Inventur nennen Sie Ihre Bestände. Mit „Liste / Foto bereitstellen“ können Sie vorhandene Unterlagen zur Übernahme vormerken.</p></div></div><div class="guide-key"><h2>Diese Hilfen finden Sie bei den Fragen</h2><p><span class="key-help">!</span> Erklärung und Beispiel öffnen</p><p><span class="key-extra">＋ Angaben ergänzen</span> Zusätzliche Angaben, wenn Sie diese kennen</p><p><span class="key-action">Antwort-Alternativen</span> Unbekannt, nicht vorhanden oder persönlich klären</p></div><details class="prefill-details"><summary>Bereits aus dem Vorgespräch übernommen</summary><div class="prefill"><b>Haushalt Beispiel · Hauptwohnsitz</b><br>Zwei Erwachsene. Versorgung am Hauptwohnsitz.<br>Kein weiterer Aufenthaltsort vereinbart.</div><p class="note">Fiktive Vorabdaten dieser Vorschau. Im echten Fragebogen stehen hier Ihre bestätigten Angaben. Änderungen können Sie am Ende mitteilen.</p></details><div class="team"><strong>Danach übernehmen wir.</strong>Wir prüfen Ihre Angaben und Unterlagen, berechnen Bedarf und Reichweiten und erstellen Ihren konkreten Maßnahmenplan.</div>`}
const friendly=n=>n.replace(/Personenkennung oder Vorname/g,'Vorname oder Kürzel').replace(/Personenbezug|Personenkennung|Personenverweis/g,'Person').replace(/Standortverweis/g,'Standort').replace(/Raumverweis/g,'Raum').replace(/Geräteverweis/g,'Gerät').replace(/Fahrzeugverweis/g,'Fahrzeug').replace(/Kontaktkennung|Kontaktverweis/g,'Kontakt').replace(/Gegenstandsverweis/g,'Gegenstand').replace(/Inventargegenstand/g,'Gegenstand aus Ihrem Bestand').replace(/Tierverweis/g,'Tier').replace(/Angabestatus/g,'Stand Ihrer Angabe');
function field(q,f,i,e){let val=state(q.id).entries[e][i]??'', id=`f_${q.id}_${e}_${i}`, opts=f.optionen||[], ty=f.typ.toLowerCase(), name=friendly(f.name), input=''; let attr=`id="${id}" data-q="${q.id}" data-e="${e}" data-f="${i}"`;

 else if(opts.length||ty==='boolean'){if(!opts.length)opts=['Ja','Nein','Weiß ich nicht'];input=`<div class="choices">${opts.map((o,k)=>`<label class="choice"><input type="radio" name="${id}" ${attr.replace(`id="${id}"`,`id="${id}_${k}"`)} value="${esc(o)}" ${val===o?'checked':''}>${esc(o)}</label>`).join('')}</div>`} 
 else if(/datei|dokument|foto/.test(ty)||/Foto|Unterlage|Anleitung|Etikett.*optional/.test(f.name)){input=`<input type="text" ${attr} value="${esc(val)}" placeholder="Kurze Angabe oder vorhandenes Dokument benennen"><input type="file" data-file="${q.id}_${e}_${i}" aria-label="${esc(name)}: Datei auswählen"><p class="note">Dateien werden hier nicht hochgeladen. Sie können Unterlagen separat an uns übergeben.</p>`}

 else input=`<input type="text" ${attr} value="${esc(val)}" placeholder="Kurze Angabe genügt; unbekannt darf offenbleiben">`;
 if(opts.some(o=>/^(Andere|anderes|Sonstiges)$/i.test(o))){let show=Array.isArray(val)?val.some(o=>/^(Andere|anderes|Sonstiges)$/i.test(o)):/^(Andere|anderes|Sonstiges)$/i.test(val);input+=`<div id="other_${id}" ${show?'':'hidden'}><label class="field" for="detail_${id}">Was genau?</label><input id="detail_${id}" data-other-q="${q.id}" data-other-e="${e}" data-other-f="${i}" value="${esc(state(q.id).other?.[e+'_'+i]||'')}" placeholder="Kurze Ergänzung"></div>`;}
 return opts.length||ty==='boolean'?`<div><fieldset><legend>${esc(name)}</legend>${input}</fieldset></div>`:`<div><label class="field" for="${id}">${esc(name)}</label>${input}</div>`}
function conditionHidden(q,f,e){return (q.field_rules||[]).some(r=>{let i=q.viewfields.findIndex(x=>x.source_index===r.trigger);return r.targets.includes(f.source_index)&&r.values.includes(state(q.id).entries[e][i])});}

const oldActive=active;
active=function(q){
 if(q.gate==='Kinder oder betreute Personen')return oldActive(q);
 if(rootQuestions.has(q.id))return true;
 if(q.id==='B_anhaenger')return scope['Anhänger vorhanden']==='ja';

function shown(q){return active(q)&&(phase==='alle'||(phase==='vorab'?q.erhebungsphase==='vorab':q.erhebungsphase==='onlinegespraech'||['persönlich besprechen','weiß ich nicht','Unterlagen übernehmen'].includes(state(q.id).status)));}
function nonempty(v){return Array.isArray(v)?v.length>0:v!==undefined&&v!==null&&String(v).trim()!=='';}

function valuesMarkup(q,a){return (a.entries||[]).map((e,ei)=>Object.entries(e).filter(([i,v])=>nonempty(v)&&q.viewfields[i]&&!conditionHidden(q,q.viewfields[i],ei)).map(([i,v])=>'<p class="note"><b>'+esc(friendly(q.viewfields[i].name))+':</b> '+esc(Array.isArray(v)?v.join(', '):v)+(a.provenance?.[ei+'_'+i]?'<br>Quelle: '+esc(sourceText(a.provenance[ei+'_'+i])):'')+'</p>').join('')).join('')+Object.entries(a.other||{}).filter(([k,v])=>{let [e,f]=k.split('_');let selected=a.entries[e]?.[f];return nonempty(v)&&(Array.isArray(selected)?selected.some(x=>/^(Andere|anderes|Sonstiges)$/i.test(x)):/^(Andere|anderes|Sonstiges)$/i.test(selected||''));}).map(([k,v])=>'<p>Ergänzung: '+esc(v)+'</p>').join('');}
conditionalField=function(q,f,i,e){let result=baseField(q,f,i,e),p=state(q.id).provenance?.[e+'_'+i];return result+(p?'<p class="note source">Aus dem Vorgespräch: '+esc(sourceText(p))+'<br>'+esc(p.status==='korrigiert'?'Von Ihnen korrigiert; ursprüngliche Angabe bleibt im Verlauf.':p.status==='bestaetigt'?'Von Ihnen bestätigt.':'Bitte prüfen und bei Bedarf direkt ändern.')+'</p>':'');};
const nativeField=field;
field=function(q,f,i,e){let markup=nativeField(q,f,i,e);if((f.optionen||[]).length)return markup;let source=null;if(/Personenbezug|Personenkennung|Personenverweis/.test(f.name))source='A_PERSON';else if(/Geräteverweis/.test(f.name))source='B_geraet';else if(/Raumverweis/.test(f.name))source='A_WOHN';else if(/Fahrzeugverweis/.test(f.name))source='B_fahrzeug';else if(/Kontaktkennung|Kontaktverweis/.test(f.name)&&q.id!=='R01')source='R01';if(!source)return markup;let fieldIndex=source==='B_geraet'?2:source==='A_WOHN'?1:0;let options=[...new Set((answers[source]?.entries||[]).map(row=>row[fieldIndex]).filter(nonempty))];let list='refs_'+q.id+'_'+e+'_'+i;return markup.replace('type="text"','type="text" list="'+list+'"')+'<datalist id="'+list+'">'+options.map(v=>'<option value="'+esc(v)+'"></option>').join('')+'</datalist>';};
